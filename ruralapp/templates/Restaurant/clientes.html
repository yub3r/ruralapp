{% extends 'base.html' %}
{% block content %}
<section class="card card-body">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="mb-0">Clientes</h5>
        <div class="d-flex gap-2">
            <form method="get" class="d-flex gap-2" id="search-form">
                <input type="text" name="q" value="{{ q }}" class="form-control form-control-sm"
                    placeholder="Buscar..." />
                <button class="btn btn-sm btn-outline-primary" type="submit">Buscar</button>
            </form>
            <a href="{% url 'new_client' %}" class="btn btn-sm btn-success">Nuevo Cliente</a>
        </div>
    </div>
    <div class="table-responsive" style="max-height:400px;">
        <table class="table table-sm table-striped mb-0">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Creado</th>
                    <th scope="col" class="text-center">Activo</th>
                    <th scope="col" class="text-center">Editar</th>
                </tr>
            </thead>
            <tbody>
                {% for org in clients %}
                <tr>
                    <td>{{ org.name }}</td>
                    <td>{{ org.created_at|date:"d/m H:i" }}</td>
                    <td class="text-center">{% if org.is_active %}<i class="bi bi-check-circle-fill text-success"></i>{%
                        else %}<i class="bi bi-x-circle-fill text-danger"></i>{% endif %}</td>
                    <td class="text-center">
                        <a class="btn btn-warning btn-sm" href="{% url 'edit_client' org.id %}">
                            <i class="bi bi-pencil-square"></i>
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center small text-muted">Sin clientes aún</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>
}
});
})();
</script>
<div class="mt-3 d-grid">
    <a href="{% url 'restoboard' %}" class="btn btn-outline-secondary">Volver</a>
</div>
</main>
{% endblock %}
