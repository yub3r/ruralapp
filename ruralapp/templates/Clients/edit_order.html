{% extends 'base.html' %}
{% block js %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        let mainDishSelect = document.querySelector('select[name="main_dish"]');
        let saladSelect = document.querySelector('select[name="salad"]');
        let otherDishSelect = document.querySelector('select[name="other_dish"]');
        let sideDishSelect = document.querySelector('select[name="side_dish"]');
        let commentsTextarea = document.querySelector('textarea[name="comments"]');
        let repeatForWeekCheckbox = document.querySelector('input[name="repeat_for_week"]');
        let updateButton = document.querySelector('button[type="submit"]');

        function toggleDisabled(selectElement, disable) {
            selectElement.disabled = disable;
            if (disable) { selectElement.value = ''; }
        }
        function updateRepeatForWeekState() {
            if (mainDishSelect.value !== '') { repeatForWeekCheckbox.checked = false; repeatForWeekCheckbox.disabled = true; }
            else { repeatForWeekCheckbox.disabled = false; }
        }
        mainDishSelect.addEventListener('change', function() {
            let sel = mainDishSelect.value !== '';
            toggleDisabled(saladSelect, sel); toggleDisabled(otherDishSelect, sel);
            if (sel) { toggleDisabled(sideDishSelect, true); commentsTextarea.value=''; }
            updateRepeatForWeekState();
        });
        saladSelect.addEventListener('change', function() {
            let sel = saladSelect.value !== '';
            toggleDisabled(mainDishSelect, sel); toggleDisabled(otherDishSelect, sel);
            if (sel) { toggleDisabled(sideDishSelect, true); commentsTextarea.value=''; }
        });
        otherDishSelect.addEventListener('change', function() {
            let opt = otherDishSelect.options[otherDishSelect.selectedIndex];
            let plusSide = opt && opt.getAttribute('data-plus-side') === 'true';
            toggleDisabled(sideDishSelect, !plusSide);
            let sel = otherDishSelect.value !== '';
            toggleDisabled(mainDishSelect, sel); toggleDisabled(saladSelect, sel);
            if (!plusSide) sideDishSelect.value = '';
        });
        document.querySelector('form').addEventListener('submit', function(event) {
            event.preventDefault();
            updateButton.disabled = true; updateButton.innerHTML='<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Actualizando...';
            let md = mainDishSelect.value, sd = saladSelect.value, od = otherDishSelect.value; let opt = otherDishSelect.options[otherDishSelect.selectedIndex];
            let plusSide = opt && opt.getAttribute('data-plus-side') === 'true';
            if (!md && !sd && !od) { Swal.fire({icon:'error',title:'Error',text:'Debe seleccionar al menos un menú principal, una ensalada o un menú de dieta.'}).then(()=>{updateButton.disabled=false;updateButton.innerHTML='Actualizar Pedido';}); return; }
            if (plusSide && !sideDishSelect.value) { Swal.fire({icon:'error',title:'Error',text:'Debe seleccionar una guarnición para el plato seleccionado.'}).then(()=>{updateButton.disabled=false;updateButton.innerHTML='Actualizar Pedido';}); return; }
            let form = event.target; let formData = new FormData(form);
            fetch("{% url 'edit_order' order.id %}", {method:'POST', body:formData, headers:{'X-CSRFToken':formData.get('csrfmiddlewaretoken')}})
            .then(r=>r.json()).then(data=>{ updateButton.disabled=false; updateButton.innerHTML='Actualizar Pedido'; if(data.success){ Swal.fire({icon:'success',title:'¡Modificación Exitosa!',html:'Hemos modificado tu pedido',confirmButtonText:'Entendido'}).then(()=>{window.location.href="{% url 'mis_ordenes' %}";}); } else if(data.error){ Swal.fire({icon:'error',title:'Error',text:data.error}); } })
            .catch(err=>{ updateButton.disabled=false; updateButton.innerHTML='Actualizar Pedido'; console.error(err); });
        });
        updateRepeatForWeekState();
    });
</script>
{% endblock %}
{% block content %}
<main class="container" style="max-width:600px;">
    <section class="card card-body">
        <header><h1 class="display-6 text-center">Editar Pedido</h1></header>
        <form method="post" enctype="multipart/form-data" class="w-100">{% csrf_token %}
            <div class="row justify-content-center mt-3">
                <div class="form-group mb-2">
                    <label for="main_dish">Menú del día {{ menu_day_name }}:</label>
                    <select name="main_dish" class="form-control">
                        <option value="">Seleccionar plato principal</option>
                        {% for dish in main_dishes %}<option value="{{ dish }}" {% if dish == order.main_dish %}selected{% endif %}>{{ dish }}</option>{% endfor %}
                    </select>
                </div>
                <div class="form-group mb-2">
                    <label for="salad">Ensalada</label>
                    <select name="salad" class="form-control">
                        <option value="">Seleccionar ensalada</option>
                        {% for salad in salads %}<option value="{{ salad.id }}" {% if order.salad and salad.id == order.salad.id %}selected{% endif %}>{{ salad.name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="form-group mb-2">
                    <label for="other_dish">Opcional</label>
                    <select name="other_dish" class="form-control">
                        <option value="">Seleccionar otro plato</option>
                        {% for other_dish in other_dishes %}<option value="{{ other_dish.id }}" data-plus-side="{{ other_dish.plus_side|yesno:"true,false" }}" {% if order.other_dish and order.other_dish.id == other_dish.id %}selected{% endif %}>{{ other_dish.name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="form-group mb-2">
                    <label for="side_dish">Guarnición</label>
                    <select name="side_dish" class="form-control" {% if not order.other_dish or not order.other_dish.plus_side %}disabled{% endif %}>
                        <option value="">Seleccionar guarnición</option>
                        {% for side_dish in side_dishes %}<option value="{{ side_dish.id }}" {% if order.side_dish and order.side_dish.id == side_dish.id %}selected{% endif %}>{{ side_dish.name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="form-group mb-2"><label for="comments">Comentarios</label><textarea name="comments" class="form-control" rows="3">{{ order.comments }}</textarea></div>
            </div>
            <div class="form-group mb-2 d-flex justify-content-end">
                <label>No seguir elección automática de la orden semanal ┤ <input type="checkbox" name="repeat_for_week" {% if order.repeat_for_week %}checked{% endif %}></label>
            </div>
            <button class="btn btn-primary w-100" style="margin-top: 12px" type="submit">Actualizar Pedido</button>
            <div class="d-flex"><a href="{% url 'mis_ordenes' %}" style="margin-top: 8px" class="btn btn-secondary flex-fill">Cancelar</a></div>
        </form>
    </section>
</main>
{% endblock %}
